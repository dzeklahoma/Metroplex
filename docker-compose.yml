services:
  postgres:
    image: postgres:15
    container_name: metroplex_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metroplex
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: prod
    container_name: metroplex_backend
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/metroplex
      JWT_SECRET: supersecret
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
    container_name: metroplex_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
  backend_test:
    build:
      context: ./backend
      target: test
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/metroplex_test?schema=public
      JWT_SECRET: supersecret
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001
volumes:
  postgres_data:
