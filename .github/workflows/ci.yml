name: Metroplex CI

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metroplex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metroplex_test?schema=public
      JWT_SECRET: testsecret
      NODE_ENV: test
      PORT: 0
      PRISMA_MIGRATE_SKIP_SEED: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # BACKEND
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Prisma generate
        working-directory: ./backend
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Reset test DB schema
        run: |
          docker exec -i $(docker ps -q --filter "ancestor=postgres:15" | head -n 1) \
            psql -U postgres -d metroplex_test -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'

      - name: Apply migrations (test DB)
        working-directory: ./backend
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Run backend tests
        working-directory: ./backend
        run: npm run test:ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      # FRONTEND
      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Test frontend
        working-directory: ./frontend
        run: npm run test
      # DOCKER CHECK
      - name: Docker build
        run: docker compose build
